<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Login</title>
<script>
(function () {
    try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
    --bg:#0a0e13;--panel:#141b24;--panel-2:#1e2733;--border:#2e3946;--border-soft:#212a35;
    --text:#f6f9fc;--text-dim:#b9c3d1;--text-faint:#8c97a6;--accent:#ffc35c;--accent-soft:rgba(255,195,92,.16);
    --danger:#ff6f6b;--danger-soft:rgba(255,111,107,.14);--on-accent:#1a1305;
    --font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
    color-scheme:dark;
}
[data-theme="light"]{
    --bg:#eef1f5;--panel:#ffffff;--panel-2:#f1f4f8;--border:#dbe1e9;--border-soft:#e6eaf0;
    --text:#12161d;--text-dim:#3f4854;--text-faint:#5f6976;--accent:#b3690a;--accent-soft:rgba(179,105,10,.12);
    --danger:#c9302c;--danger-soft:rgba(201,48,44,.1);--on-accent:#fff8ec;
    color-scheme:light;
}
*{box-sizing:border-box;}
body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
}
.card{
    width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border-soft);
    border-radius:16px;padding:32px 28px;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.mark{
    width:44px;height:44px;display:grid;place-items:center;background:var(--panel-2);
    border:1px solid var(--border);border-radius:10px;margin-bottom:18px;
}
.mark svg{width:22px;height:22px;}
h1{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 4px 0;}
p.sub{font-size:13px;color:var(--text-faint);margin:0 0 22px 0;}
label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-faint);font-weight:600;}
input{
    width:100%;margin-top:6px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-mono);font-size:14px;padding:12px 14px;border-radius:9px;
}
input:focus{outline:none;border-color:var(--accent);}
button{
    width:100%;margin-top:18px;background:var(--accent);color:var(--on-accent);border:none;
    font-weight:700;font-size:14px;padding:13px;border-radius:9px;cursor:pointer;transition:filter .15s ease;
}
button:hover{filter:brightness(1.08);}
button:disabled{opacity:.6;cursor:default;}
.err{
    display:none;margin-top:14px;background:var(--danger-soft);border:1px solid var(--danger);
    color:var(--danger);font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:8px;
}
.err.show{display:block;}
</style>
</head>
<body>
<div class="card">
    <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6">
            <rect x="3" y="3" width="6" height="6" rx="1.4"></rect>
            <rect x="15" y="3" width="6" height="6" rx="1.4"></rect>
            <rect x="3" y="15" width="6" height="6" rx="1.4"></rect>
            <rect x="15" y="15" width="6" height="6" rx="1.4" fill="var(--accent)" fill-opacity=".35"></rect>
        </svg>
    </div>
    <h1>BingoOps Cloud</h1>
    <p class="sub">Enter a Cloud ID to view that hall's synced status.</p>
    <form id="login-form">
        <label for="agent-id">Cloud ID</label>
        <input type="text" id="agent-id" placeholder="e.g. AG-4821" autocomplete="off" required>
        <button type="submit" id="login-btn">View Dashboard</button>
    </form>
    <div class="err" id="login-err"></div>
</div>
<script>
const form = document.getElementById('login-form');
const btn = document.getElementById('login-btn');
const errBox = document.getElementById('login-err');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const agentId = document.getElementById('agent-id').value.trim();
    if (!agentId) return;

    errBox.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Checking…';

    try {
        const response = await fetch('/api/cloud/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agentId })
        });
        const result = await response.json();
        if (response.ok && result.success) {
            sessionStorage.setItem('cloudAgentId', agentId);
            window.location.href = './cloud-dash.html';
        } else {
            errBox.textContent = result.message || 'Cloud ID not found.';
            errBox.classList.add('show');
        }
    } catch (err) {
        errBox.textContent = 'Could not reach the server. Try again.';
        errBox.classList.add('show');
    } finally {
        btn.disabled = false;
        btn.textContent = 'View Dashboard';
    }
});
</script>
</body>
</html>
